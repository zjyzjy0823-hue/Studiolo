name: Desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'backend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Build sidecar (native Windows only)
        run: python scripts/build-backend-sidecar.py --target x86_64-pc-windows-msvc --clean

      - name: Build Tauri app and installers
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path "$releaseDir/studiolo-backend.exe")) {
            Copy-Item "src-tauri/binaries/studiolo-backend-x86_64-pc-windows-msvc.exe" "$releaseDir/studiolo-backend.exe"
          }
          Compress-Archive -Path "$releaseDir/Studiolo.exe", "$releaseDir/studiolo-backend.exe" -DestinationPath "$releaseDir/bundle/Studiolo_${version}_x64-portable.zip"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: studiolo-windows-installers
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/*.zip
          if-no-files-found: warn
